<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Masuk Sistem</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #555; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .error-message { color: red; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Log Masuk Sistem</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Nama Pengguna (Username)</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Kata Laluan</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Log Masuk</button>
            <div id="errorMessage" class="error-message"></div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = '';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                
                if (response.ok && data.status === 'success') {
                    // Simpan data penting ke dalam localStorage untuk kegunaan dashboard
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('userId', data.user.user_id);
                    localStorage.setItem('fullName', data.user.full_name);
                    localStorage.setItem('role', data.user.role);
                    
                    // Semak peranan (role) menggunakan huruf kecil untuk elakkan ralat
                    const userRole = data.user.role ? data.user.role.toLowerCase() : '';
                    
                    if (userRole === 'admin') {
                        window.location.href = '/admin-dashboard.html';
                    } else if (userRole === 'lecturer') {
                        window.location.href = '/lecturer-dashboard.html';
                    } else {
                        window.location.href = '/student-dashboard.html';
                    }
                } else {
                    errorMessage.textContent = data.message || 'Username atau password salah';
                }
            } catch (err) {
                console.error('Ralat Login:', err);
                errorMessage.textContent = 'Ralat sambungan ke server. Sila pastikan server dinyalakan.';
            }
        });
    </script>
</body>
</html>
